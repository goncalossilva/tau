name: Publish npm packages

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Keep native sandbox tests on Ubuntu 24.04 pending sandbox-runtime#429.
    # https://github.com/anthropics/sandbox-runtime/issues/429
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Verify package versions match tag
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.GITHUB_REF_NAME;
          const packages = [
            'package.json',
            'packages/tau-coding-agent/package.json',
            'packages/tau-all-agent/package.json',
          ];
          for (const file of packages) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (pkg.version !== tag) {
              console.error(`${file} version ${pkg.version} does not match tag ${tag}`);
              process.exit(1);
            }
          }
          NODE

      - name: Set up sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep socat
          # Ubuntu restricts the user namespaces needed by bubblewrap and apply-seccomp.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Publish packages
        run: |
          set -euo pipefail
          for dir in dist/tau-coding-agent dist/tau-all-agent; do
            echo "==> Publishing ${dir}"
            (cd "${dir}" && npm publish --provenance --access public)
          done
